# 1 - FleetSimulation
sim_env: BatchOfferSimulation
log_level: info
network_type: NetworkBasic
network_name: klagenfurt_h1_spitzenzeiten
demand_name: klagenfurt_h1_spitzenzeiten
rq_file: demand_requests.csv
random_seed: 0
start_time: 25200      # 7:00
end_time: 32400        # 9:00
time_step: 30
user_max_decision_time: 120
route_output_flag: True
replay_flag: True
nr_mod_operators: 1
rq_type: WaitingTimeSensitiveLinearDeclineRequest

# 2 - FleetControl
op_module: RidePoolingBatchAssignmentFleetcontrol
op_rp_batch_optimizer: AlonsoMora
op_fleet_composition:
  standard_8seat: 20
op_vr_control_func_dict:
  func_key: distance_and_user_times_man
  vot: 0.45833
  dc: 0.0694
op_min_wait_time: 0
op_max_wait_time: 480
op_max_detour_time_factor: 40
op_const_boarding_time: 45
op_add_boarding_time: 0
op_base_fare: 0
op_distance_fare: 0
op_time_fare: 0
op_min_standard_fare: 100
op_reoptimisation_timestep: 30

# Heuristics
op_treebuild_timeout_per_veh: 1
op_max_tours_per_v2rb: 4
op_optimisation_timeout: 30
op_applied_heuristic: after_opt_rv_best_v2rb
op_max_VR_con: 10

# Repositioning
op_repo_method: None

# Zone System
op_zone_system: klagenfurt_h1_spitzenzeiten

# Traveller attributes
walking_speed: 1.2
max_walking_dist: 300
