# studies/klagenfurt/klagenfurt_constant.yml

# 1 – FleetSimulation
sim_env: BatchOfferSimulation
log_level: info
network_type: NetworkBasic
network_name: klagenfurt
demand_name: klagenfurt
rq_file: demand_requests.csv
random_seed: 0
start_time: 25200
end_time: 32400
time_step: 30
user_max_decision_time: 30
route_output_flag: True
replay_flag: True
nr_mod_operators: 1
rq_type: BasicRequest

# 2 – FleetControl
op_module: RidePoolingBatchAssignmentFleetcontrol
op_rp_batch_optimizer: AlonsoMora
op_fleet_composition: OVERWRITE_IN_SCENARIO_CONFIG
op_vr_control_func_dict:
  func_key: distance_and_user_times_man
  vot: 0.45833
  dc: 0.0694
op_min_wait_time: 0
op_max_wait_time: 480
op_max_detour_time_factor: 40
op_const_boarding_time: 30
op_add_boarding_time: 0
op_base_fare: 0
op_distance_fare: 0
op_time_fare: 0
op_min_standard_fare: 100
op_reoptimisation_timestep: 30

# Heuristics (unused by AlonsoMora but required fields)
op_treebuild_timeout_per_veh: 1
op_max_tours_per_v2rb: 4
op_optimisation_timeout: 30
op_applied_heuristic: after_opt_rv_best_v2rb
op_max_VR_con: 10

# Repositioning
# op_repo_method: AlonsoMoraRepositioning
op_repo_method: None
# Comment out or remove these lines while testing
# op_repo_horizons: [0, 900]
# op_repo_lock: False
# op_repo_timestep: 900
# op_temporal_resolution: 900

# Zone system
op_zone_system: klagenfurt

# Add or update these lines in your constant file:
vehicle_types_file: data/vehicles/default_vehtype.csv
default_vehicle_type: default_vehtype
